name: Release

# Builds a Windows .exe whenever something lands on `main` and publishes it
# as a GitHub Release. Every push rebuilds the release: the release for the
# current version in Cargo.toml is deleted and recreated at the latest commit
# with fresh generated notes. Bump `version` in Cargo.toml to cut a new
# release tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"      >> $env:GITHUB_OUTPUT
          Write-Host "Building Culvert v$version"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/culvert.exe dist/
          New-Item -ItemType Directory -Path dist/assets -Force | Out-Null
          Copy-Item assets/icon.png dist/assets/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "culvert-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: culvert-windows-x64
          path: culvert-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release (refreshed on every push)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "culvert-${{ steps.version.outputs.version }}-windows-x64.zip"
          # One rolling release per versioned tag: replace the previous
          # release (and its tag) so the new one lands on this exact commit
          # and shows a fresh publish date and fresh generated notes.
          gh release delete $tag -y --cleanup-tag
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous release for $tag — creating the first one."
          }
          Start-Sleep -Seconds 5
          gh release create $tag $zip --target ${{ github.sha }} --title "Culvert $tag" --generate-notes
