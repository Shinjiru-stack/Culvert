name: Release

# Builds a Windows .exe whenever something lands on `main` and publishes it
# as a GitHub Release. The release number advances on every build: it is the
# major.minor from Cargo.toml plus the git commit count as the patch value
# (e.g. 0.3 + 24 commits -> v0.3.24), exactly the version string the running
# app displays in its title bar and status bar. Every push therefore lands on
# its own uniquely tagged release at the exact commit it was built from.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the build number comes from the commit count.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Derive build version (major.minor + commit count)
        id: version
        shell: pwsh
        run: |
          $m = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9]+)\.([0-9]+)').Matches[0].Groups
          $count = (git rev-list --count HEAD | Select-Object -Last 1).Trim()
          $version = "$($m[1].Value).$($m[2].Value).$count"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"      >> $env:GITHUB_OUTPUT
          Write-Host "Building Culvert v$version"

      - name: Remove superseded releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $m = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([0-9]+)\.([0-9]+)').Matches[0].Groups
          # Delete the pre-per-build rolling releases (v<major>.<minor>.0 from
          # Cargo.toml alone); per-build tags are v<major>.<minor>.<count> and
          # can never collide with commit-count 0. Once the legacy release is
          # gone this is a no-op — never let it fail the run.
          $legacy = "v$($m[1].Value).$($m[2].Value).0"
          gh release view $legacy 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $legacy -y --cleanup-tag
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Deleted superseded release $legacy (old rolling scheme)."
            }
          } else {
            Write-Host "No legacy release $legacy found - nothing to clean."
          }
          $global:LASTEXITCODE = 0
          exit 0

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/culvert.exe dist/
          New-Item -ItemType Directory -Path dist/assets -Force | Out-Null
          Copy-Item assets/icon.png dist/assets/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "culvert-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: culvert-windows-x64
          path: culvert-*-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release (per-build tag)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $zip = "culvert-${{ steps.version.outputs.version }}-windows-x64.zip"
          # Each push has its own commit-count tag; create it at this exact
          # commit. If the tag somehow already exists (workflow re-run on the
          # same commit), refresh that release in place.
          gh release create $tag $zip --target ${{ github.sha }} --title "Culvert $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag already exists - refreshing in place."
            gh release delete $tag -y --cleanup-tag
            Start-Sleep -Seconds 5
            gh release create $tag $zip --target ${{ github.sha }} --title "Culvert $tag" --generate-notes
          }
