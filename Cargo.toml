[package]
name = "culvert"
version = "0.3.0"
edition = "2021"
description = "Modern, native SSH client and tunnel manager for the desktop — local, remote and dynamic port forwarding with a built-in terminal"
authors = ["Shinjiru-stack"]
license = "MIT"

[[bin]]
name = "culvert"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
russh = "0.64"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
vt100 = "0.16"
russh-sftp = "2"
# Clipboard read for the terminal quick-bar Paste button (eframe already
# pulls arboard for its own TextEdit paste handling, so this adds no new
# native dependencies).
arboard = "3"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
png = "0.17"
ico = "0.3"

[profile.release]
opt-level = 2
strip = true
